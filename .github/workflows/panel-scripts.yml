name: panel-scripts

# Panelin (byte.semihkopcal.com) SENARYO islemleri: yeni hikaye ekle, kuyrukta one al, kuyruktan sil.
# YALNIZ workflow_dispatch. Panel depoya yazamaz (token'i yalniz Actions + Contents okuma); bu workflow
# yazar. Kolay form R2'de (scripts-in/), sonuc R2'ye (scripts-out/) gider, panel oradan okur.
#
# Guvenlik:
#   - Girdiler yalniz ENV uzerinden okunur, hicbir zaman run: icine ${{ }} ile gomulmez;
#     tools/panel_scripts.py her girdiyi katı bicimle dogrular.
#   - Panelden gelen form ASLA dogrudan commit edilmez: editorial/formscript.py ile senaryoya cevrilir ve
#     AYNI kapidan (editorial.authored) gecmeden dosya yazilmaz.
#   - Yalniz content/ degisir (git add content). Platform token'lari bu workflow'a verilmez.
#   - Ayni anda tek kosu (concurrency): iki istek ayni senaryo numarasini almasin, order.json carpismasin.
#   - "eklendi" sonucu push GERCEKTEN basarili olunca panele gider.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "islem"
        required: true
        type: choice
        options: [ingest, move_first, remove]
      script_id:
        description: "senaryo kimligi (move_first / remove icin; ingest'te bos)"
        required: false
        type: string
        default: ""
      request_id:
        description: "panelin istek kimligi (32 hex)"
        required: true
        type: string

concurrency:
  group: panel-scripts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # daily.yml ile AYNI anahtar: kare cizim kontrolu icin fontlar hazir gelir.
      - name: arac cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/bin
            ~/.local/share/fonts/inter
            ~/.local/share/fonts/cjk
          key: runner-tools-ffmpeg-inter4-notojp-v2

      # Font kurulumu basarisiz olursa kare kontrolu atlanir; senaryo kapisi yine calisir.
      - name: fontlar
        continue-on-error: true
        run: bash tools/setup_runner.sh

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-publish.txt

      - run: pip install Pillow==13.0.0 numpy==2.4.6 pyyaml boto3==1.43.126

      - name: uygula
        env:
          ACTION: ${{ inputs.action }}
          SCRIPT_ID: ${{ inputs.script_id }}
          REQUEST_ID: ${{ inputs.request_id }}
          DRAW_CHECK: "1"
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python tools/panel_scripts.py apply

      - name: depoya yaz
        id: push
        env:
          ACTION: ${{ inputs.action }}
        run: |
          git config user.name  "byte-bot"
          git config user.email "byte-bot@users.noreply.github.com"
          git add -A content
          git diff --cached --quiet || git commit -m "panel-scripts: $ACTION"
          # GitHub ara sira 500 donuyor; tek denemede pes etme. Her denemede once rebase.
          ok=0
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash && git push; then ok=1; break; fi
            echo "::warning title=git push::deneme $i/5 olmadi, ${i}0 sn sonra tekrar"
            sleep $((i * 10))
          done
          if [ "$ok" != "1" ]; then echo "::error title=git push::5 denemede de push edilemedi"; exit 1; fi

      - name: sonucu panele bildir
        if: always()
        env:
          ACTION: ${{ inputs.action }}
          REQUEST_ID: ${{ inputs.request_id }}
          PUSH_OK: ${{ steps.push.outcome == 'success' }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python tools/panel_scripts.py report

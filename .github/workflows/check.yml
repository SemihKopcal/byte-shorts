name: check

# Her push'ta: kod bozuk mu, workflow YAML'lari gecerli mi, testler geciyor mu.
# Gece 04:15'te daily patlayinca ogrenmek yerine push'tan 1 dakika sonra
# yesil/kirmizi tik goruyorsun. Ag yok, Gemini yok, secret yok.
on:
  push:
  pull_request:

# Bu workflow depoya YAZMAZ ve HICBIR secret kullanmaz: fork'tan gelen PR'lar da
# calisir, sir sizdirma yolu yok. (tests/test_workflows.py bunu kilitliyor.)
permissions:
  contents: read

# Ayni dalda ust uste push'larda eskisini iptal et; bos yere dakika yakma.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      # Depo PUBLIC: commit'lenen sir silinse bile gecmiste kalir. Saglayici bicimli
      # token/anahtarlari simdi yakala (degeri gunluge yazmaz). Gecmis taramasi: audit.yml.
      - name: secret taramasi
        run: python tools/secret_scan.py

      - run: pip install Pillow==13.0.0 numpy==2.1.3 pyyaml

      - name: sozdizimi
        run: python -m compileall -q worker editorial publish tools tests

      # Elle/Claude tarafindan yazilmis senaryolarin kapisi: her ekran sayisi
      # hesapla ya da kaynakla eslesmeli, kaynaklar https, yayin metni temiz.
      - name: yazilmis senaryolar
        run: python -m editorial.authored

      - name: shell scriptleri
        run: |
          scripts="tools/setup_runner.sh tools/fetch_voice.sh tools/release.sh tools/host_video.sh panel/deploy/server-setup.sh panel/deploy/update.sh"
          bash -n $scripts
          shellcheck -S warning $scripts

      # Workflow'a gomulu bir satir sifir sutundan baslarsa YAML sessizce
      # bozuluyor ve Actions "Invalid workflow file" diyor; bunu burada yakala.
      - name: workflow yaml
        run: python -c "import glob, yaml; [yaml.safe_load(open(f)) for f in sorted(glob.glob('.github/workflows/*.yml'))]; print('yaml tamam')"

      - name: testler
        run: python -m unittest discover -s tests -v

  # Panel (byte.semihkopcal.com): kendi testleri + CI koprusuyle sozlesme testi.
  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            panel/requirements.txt
            panel/requirements-dev.txt

      - run: pip install -r panel/requirements.txt -r panel/requirements-dev.txt

      - name: panel testleri
        working-directory: panel
        run: python -W error::ResourceWarning -m unittest discover -s tests -v

  # Panel imaji gercekten derleniyor mu, kisitli kosullarda aciliyor mu, compose dosyasi
  # gecerli mi? Bozuk bir Dockerfile ya da eksik bagimlilik sunucuda degil, PR'da yakalansin.
  # Imaj hicbir yere gonderilmez; ag, secret ve yayin yok.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: imaji derle
        run: docker build -t byte-panel:ci panel

      # Sunucudaki kisitlarla ayni: salt okunur, yetkisiz, aga cikis yok.
      - name: imajin icinde ice aktarma testi
        run: >
          docker run --rm --network none --read-only --cap-drop ALL
          --security-opt no-new-privileges --user 10001:10001
          --tmpfs /tmp:size=16m,noexec,nosuid,nodev
          byte-panel:ci python -c "import bytepanel.web, bytepanel.service, bytepanel.backup; print('import tamam')"

      # docker-compose.yml, ornek .env ve sahte sirlarla cozumlenebiliyor mu (sir degerleri
      # yer tutucu; hicbir yere baglanilmaz).
      - name: compose dosyasi gecerli mi
        working-directory: panel/deploy
        env:
          CLOUDFLARED_TAG: ci
        run: |
          cp .env.example .env
          mkdir -p secrets
          for f in r2_access_key_id r2_secret_access_key github_token csrf_secret; do echo ci-dummy > "secrets/$f"; done
          echo 'TUNNEL_TOKEN=ci-dummy' > secrets/tunnel.env
          docker compose config -q

name: daily

# Gunde 2 video (saatler UTC). TAM OTOMATIK:
#
#   senaryo  Gemini yazar, editor yargilar, kod sayilari hesaplar
#   render   kodla cizilir, QC'den gecer
#   YouTube  AUTO_PRIVACY neyse o gizlilikle yuklenir
#   defter   uretildi/yayinlandi kaydi repoya geri yazilir
#   release  video + Instagram/TikTok metinleri kalici bir adrese konur
#
# YAYIN MODU: depo degiskeni AUTO_PRIVACY
#   Settings > Secrets and variables > Actions > Variables
#   public | unlisted | private | off      (yoksa: public)
# Bir sey ters giderse tek yapacagin: AUTO_PRIVACY=off. Kod degismiyor.
# KALITE KADRANI: depo degiskeni MIN_SCORE (5-9, varsayilan 7). Editorun her
# puaninin gecmesi gereken esik; yukseltirsen daha az ama daha iyi video.
# AUTO_INSTAGRAM / AUTO_TIKTOK: `off` yaparsan o platforma gonderilmez
# (secret'lar da yoksa zaten gonderilmez). Yalnizca mod `public` iken calisirlar.
# GEMINI_MODEL: yeni modeller asiri yukluyse tek degiskenle sabitle
# (ornek: gemini-2.5-flash). Bos = otomatik en yeni kararli flash.
# ALLOW_UNVERIFIED (0-5, varsayilan 1): aramayla dogrulanamayan en fazla kac
# iddia kabul. Arama kapaliysa hicbir sey dogrulanmis sayilmaz.
on:
  schedule:
    - cron: "15 4 * * *"
    - cron: "15 13 * * *"
  workflow_dispatch:
    inputs:
      script:
        description: "content/scripts altindaki dosya adi (bos = siradaki)"
        required: false
        default: ""
      topic:
        description: "Gemini'ye verilecek konu (bos = kendi secsin)"
        required: false
        default: ""
      mode:
        description: "yayin modu (auto = AUTO_PRIVACY degiskeni, yoksa public)"
        type: choice
        options: [auto, public, unlisted, private, "off"]
        default: auto

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write          # senaryo/defter commit'i + release icin
    env:
      SCRIPT_INPUT: ${{ inputs.script }}
      TOPIC_INPUT: ${{ inputs.topic }}
      # secret'lar if: icinde okunamiyor; var mi yok mu diye burada bakiyoruz
      HAS_IG: ${{ secrets.INSTAGRAM_TOKEN != '' && secrets.INSTAGRAM_USER_ID != '' }}
      HAS_TT: ${{ secrets.TIKTOK_REFRESH_TOKEN != '' && secrets.TIKTOK_CLIENT_KEY != '' && secrets.TIKTOK_CLIENT_SECRET != '' }}
    steps:
      - uses: actions/checkout@v4

      # apt DEGIL: runner'in Ubuntu aynasi 50 KB/s'ye dusup kosuyu zaman
      # asimina sokmustu. Ayni ikililer GitHub release'inden 15 saniyede
      # geliyor, cache'lenince hic inmiyor.
      - name: arac cache
        id: tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/bin
            ~/.local/share/fonts/inter
            ~/.local/share/fonts/cjk
          key: runner-tools-ffmpeg-inter4-notojp-v2

      - name: ffmpeg + fontlar
        run: bash tools/setup_runner.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # 120 MB model her kosuda indirilmesin
      - name: ses modeli cache
        id: voice
        uses: actions/cache@v4
        with:
          path: voices
          key: piper-en-us-ryan-high-v1

      - name: ses modeli indir
        if: steps.voice.outputs.cache-hit != 'true'
        run: bash tools/fetch_voice.sh en-us-ryan-high

      # ── yayin modu ────────────────────────────────────────────────────
      - name: yayin modu
        id: mode
        env:
          INPUT_MODE: ${{ inputs.mode }}
          AUTO_PRIVACY: ${{ vars.AUTO_PRIVACY }}
        run: |
          v="${INPUT_MODE:-auto}"
          if [ "$v" = "auto" ]; then v="${AUTO_PRIVACY:-public}"; fi
          case "$v" in
            public|unlisted|private|off) ;;
            *) echo "::warning::bilinmeyen yayin modu '$v', private kullaniliyor"; v=private ;;
          esac
          echo "yayin modu: $v"
          echo "value=$v" >> "$GITHUB_OUTPUT"

      # Render'dan ONCE: secrets bozuksa 3 dakikalik render'in sonunda
      # ogrenmek yerine simdi biliyoruz. Basarisiz olsa da video uretilir
      # (continue-on-error); sadece yukleme atlanir ve kosu sonda kirmizi yanar.
      - name: youtube secrets kontrol
        id: ytcheck
        if: steps.mode.outputs.value != 'off'
        continue-on-error: true
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python publish/youtube.py --check

      # ── senaryo ───────────────────────────────────────────────────────
      - name: sirada senaryo var mi
        id: pick
        run: python tools/pick_script.py "$SCRIPT_INPUT" >> "$GITHUB_OUTPUT"

      # Sira bossa ya da konu verildiyse Gemini yazar. Editor kapisindan
      # gecemeyen konu dosyaya YAZILMIYOR (content/rejected'a neden yazilir);
      # hicbiri gecmezse kosu burada, yuksek sesle durur.
      - name: konu uret
        if: steps.pick.outputs.path == '' || env.TOPIC_INPUT != ''
        timeout-minutes: 12        # saglikli kosu 2-4 dk; takilirsa 12 dk'da biter
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          TOPIC: ${{ inputs.topic }}
          MIN_SCORE: ${{ vars.MIN_SCORE }}
          ALLOW_UNVERIFIED: ${{ vars.ALLOW_UNVERIFIED }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python -m editorial

      - name: yeni senaryoyu sec
        id: pick2
        if: steps.pick.outputs.path == '' || env.TOPIC_INPUT != ''
        run: python tools/pick_script.py --newest >> "$GITHUB_OUTPUT"

      # ── uretim ────────────────────────────────────────────────────────
      - name: uret
        id: render
        continue-on-error: true
        env:
          SCRIPT: ${{ steps.pick2.outputs.path || steps.pick.outputs.path }}
        run: python -m worker.build "$SCRIPT"

      # ── yayin ─────────────────────────────────────────────────────────
      - name: youtube'a yukle
        id: upload
        if: >-
          steps.render.outcome == 'success' &&
          steps.mode.outputs.value != 'off' &&
          steps.ytcheck.outcome == 'success'
        continue-on-error: true
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          SCRIPT: ${{ steps.pick2.outputs.path || steps.pick.outputs.path }}
          MODE: ${{ steps.mode.outputs.value }}
        run: |
          dir="$(python tools/pick_script.py --dir "$(basename "$SCRIPT")" | sed -n 's/^dir=//p')"
          python publish/youtube.py "$dir/manifest.json" --privacy "$MODE"

      # ── Instagram / TikTok ────────────────────────────────────────────
      # Sadece mod PUBLIC iken (private/unlisted test kosusu Instagram'a gitmez).
      # Her biri depo degiskeniyle kapatilir: AUTO_INSTAGRAM=off, AUTO_TIKTOK=off.
      # Secret'lar yoksa adim hic calismaz (hata degil). Basarisizlik kosuyu
      # kirmizi yapmaz, uyari yazar: asil is YouTube.
      - name: instagram'a yukle
        id: instagram
        if: >-
          steps.render.outcome == 'success' &&
          steps.mode.outputs.value == 'public' &&
          vars.AUTO_INSTAGRAM != 'off' && env.HAS_IG == 'true'
        continue-on-error: true
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          SCRIPT: ${{ steps.pick2.outputs.path || steps.pick.outputs.path }}
        run: |
          dir="$(python tools/pick_script.py --dir "$(basename "$SCRIPT")" | sed -n 's/^dir=//p')"
          url="$(bash tools/host_video.sh "$dir")"
          python publish/instagram.py "$dir/manifest.json" --video-url "$url"

      - name: tiktok taslagi
        id: tiktok
        if: >-
          steps.render.outcome == 'success' &&
          steps.mode.outputs.value == 'public' &&
          vars.AUTO_TIKTOK != 'off' && env.HAS_TT == 'true'
        continue-on-error: true
        timeout-minutes: 15
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_NEW_REFRESH_FILE: ${{ runner.temp }}/tiktok-new-refresh
          GH_PAT: ${{ secrets.GH_PAT }}
          SCRIPT: ${{ steps.pick2.outputs.path || steps.pick.outputs.path }}
        run: |
          dir="$(python tools/pick_script.py --dir "$(basename "$SCRIPT")" | sed -n 's/^dir=//p')"
          rc=0
          python publish/tiktok.py "$dir/manifest.json" || rc=$?
          # TikTok yeni refresh token dondurduysa secret'i guncelle (GH_PAT gerekir)
          if [ -s "$TIKTOK_NEW_REFRESH_FILE" ]; then
            if [ -n "$GH_PAT" ]; then
              GH_TOKEN="$GH_PAT" gh secret set TIKTOK_REFRESH_TOKEN \
                --repo "$GITHUB_REPOSITORY" < "$TIKTOK_NEW_REFRESH_FILE"
              echo "TIKTOK_REFRESH_TOKEN guncellendi"
            else
              echo "::warning::TikTok yeni refresh token verdi ama GH_PAT yok, kaydedilemedi; yarin yukleme calismayabilir (rehbere bak: GH_PAT)"
            fi
          fi
          exit $rc

      # Instagram/TikTok'u elle yuklemek icin: video + metinler kalici bir adreste. Basarisiz
      # olursa kosuyu kirmizi yapmiyor; asil is YouTube.
      - name: release
        id: release
        if: steps.render.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SCRIPT: ${{ steps.pick2.outputs.path || steps.pick.outputs.path }}
        run: |
          dir="$(python tools/pick_script.py --dir "$(basename "$SCRIPT")" | sed -n 's/^dir=//p')"
          bash tools/release.sh "$dir"

      # ── defter ────────────────────────────────────────────────────────
      # Basarisiz kosuda da isler (always): yoksa ayni bozuk senaryo her
      # kosuda yeniden secilir ve kuyruk sonsuza kadar tikanir. Reddedilen
      # konular (content/rejected) da burada commit'leniyor: "Gemini bugun
      # neden video uretmedi" sorusunun cevabi git gecmisinde.
      - name: defteri isle
        if: always()
        env:
          SCRIPT: ${{ steps.pick2.outputs.path || steps.pick.outputs.path }}
        run: |
          if [ -n "$SCRIPT" ]; then
            python tools/pick_script.py --mark "$(basename "$SCRIPT")"
          fi
          git config user.name  "byte-bot"
          git config user.email "byte-bot@users.noreply.github.com"
          git add -A content
          git diff --cached --quiet || git commit -m "daily: $(basename "${SCRIPT:-rejected}")"
          git pull --rebase --autostash
          git push

      # retention-days: ucretsiz hesapta artifact kotasi 500 MB. Video ~39 MB,
      # gunde 2 tane. Kalici kopya zaten release'te.
      - name: artifact
        if: steps.render.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          path: |
            out/**/*.mp4
            out/**/manifest.json
            out/**/captions.md
          retention-days: 2
          if-no-files-found: error

      # Kosunun rengi gercegi soylesin: video uretilmediyse ya da yukleme
      # basarisizsa kirmizi. (continue-on-error adimlari tek basina kirmizi
      # yakmaz; burada hepsini toplayip karar veriyoruz.)
      - name: sonuc
        if: always()
        env:
          RENDER: ${{ steps.render.outcome }}
          UPLOAD: ${{ steps.upload.outcome }}
          YTCHECK: ${{ steps.ytcheck.outcome }}
          RELEASE: ${{ steps.release.outcome }}
          INSTAGRAM: ${{ steps.instagram.outcome }}
          TIKTOK: ${{ steps.tiktok.outcome }}
        run: |
          fail=0
          if [ "$RENDER" != "success" ]; then
            echo "::error::video uretilemedi"; fail=1
          fi
          if [ "$YTCHECK" = "failure" ]; then
            echo "::error::YouTube secrets gecersiz (check adimina bak); video yuklenmedi"; fail=1
          fi
          if [ "$UPLOAD" = "failure" ]; then
            echo "::error::YouTube yuklemesi basarisiz"; fail=1
          fi
          if [ "$INSTAGRAM" = "failure" ]; then
            echo "::warning::Instagram'a yuklenemedi (instagram adimina bak); video Release'te, elle yukleyebilirsin"
          fi
          if [ "$TIKTOK" = "failure" ]; then
            echo "::warning::TikTok taslagi olusturulamadi (tiktok adimina bak); video Release'te"
          fi
          if [ "$RELEASE" = "failure" ]; then
            echo "::warning::release olusturulamadi (Instagram/TikTok icin kalici adres yok)"
          fi
          exit $fail

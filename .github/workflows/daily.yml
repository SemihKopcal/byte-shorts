name: daily

# Gunde 2 video. Saatler UTC.
# Yukleme ADIMI YOK: hat sadece uretiyor, sen artifact'i indirip izliyorsun.
# Onayladiktan sonra publish.yml'i elle tetikleyerek YouTube'a basiyoruz.
on:
  schedule:
    - cron: "15 4 * * *"
    - cron: "15 13 * * *"
  workflow_dispatch:
    inputs:
      script:
        description: "content/scripts altindaki dosya (bos = siradaki)"
        required: false
        default: ""

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # Inter fontu sart: yoksa Pillow sessizce baska fonta duser ve video
      # bambaska gorunur. draw.py bulamazsa hata firlatiyor, burasi onu besler.
      - name: sistem paketleri
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg fonts-inter fontconfig
          fc-cache -f

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # 120 MB model her kosuda indirilmesin. Cache anahtari ses adiyla sabit.
      - name: ses modeli cache
        id: voice
        uses: actions/cache@v4
        with:
          path: voices
          key: piper-en-us-ryan-high-v1

      - if: steps.voice.outputs.cache-hit != 'true'
        run: bash tools/fetch_voice.sh en-us-ryan-high

      - name: script sec
        id: pick
        run: |
          if [ -n "${{ inputs.script }}" ]; then
            echo "path=content/scripts/${{ inputs.script }}" >> "$GITHUB_OUTPUT"
          else
            # published.json'da olmayan en eski script
            python - <<'PY' >> "$GITHUB_OUTPUT"
import json, pathlib
done = set()
p = pathlib.Path("content/published.json")
if p.exists():
    done = {x["id"] for x in json.loads(p.read_text())}
for f in sorted(pathlib.Path("content/scripts").glob("*.json")):
    if json.loads(f.read_text())["id"] not in done:
        print(f"path={f}")
        break
else:
    print("path=")
PY
          fi

      - name: uret
        if: steps.pick.outputs.path != ''
        run: python -m worker.build "${{ steps.pick.outputs.path }}"

      - name: sira bos
        if: steps.pick.outputs.path == ''
        run: |
          echo "::warning::Uretilecek script kalmadi -- content/scripts'e ekle."

      # retention-days: ucretsiz hesapta artifact kotasi 500 MB. Video ~39 MB,
      # gunde 2 tane. 2 gun tutmak ~160 MB demek, rahat.
      - uses: actions/upload-artifact@v4
        if: steps.pick.outputs.path != ''
        with:
          name: video-${{ github.run_number }}
          path: |
            out/**/*.mp4
            out/**/manifest.json
          retention-days: 2
          if-no-files-found: error

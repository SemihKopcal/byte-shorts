name: daily

# Gunde 2 video. Saatler UTC.
# Yukleme ADIMI YOK: hat sadece uretiyor, sen artifact'i indirip izliyorsun.
# Onayladiktan sonra publish.yml'i elle tetikleyerek YouTube'a basiyoruz.
on:
  schedule:
    - cron: "15 4 * * *"
    - cron: "15 13 * * *"
  workflow_dispatch:
    inputs:
      script:
        description: "content/scripts altindaki dosya adi (bos = siradaki)"
        required: false
        default: ""

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # Inter fontu sart: yoksa Pillow sessizce baska fonta duser ve video
      # bambaska gorunur. draw.py bulamazsa hata firlatiyor, burasi onu besler.
      - name: sistem paketleri
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-inter fontconfig
          fc-cache -f

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # 120 MB model her kosuda indirilmesin. Cache anahtari ses adiyla sabit.
      - name: ses modeli cache
        id: voice
        uses: actions/cache@v4
        with:
          path: voices
          key: piper-en-us-ryan-high-v1

      - name: ses modeli indir
        if: steps.voice.outputs.cache-hit != 'true'
        run: bash tools/fetch_voice.sh en-us-ryan-high

      - name: script sec
        id: pick
        run: python tools/pick_script.py "${{ inputs.script }}" >> "$GITHUB_OUTPUT"

      - name: uret
        if: steps.pick.outputs.path != ''
        run: python -m worker.build "${{ steps.pick.outputs.path }}"

      - name: sira bos
        if: steps.pick.outputs.path == ''
        run: echo "::warning::Uretilecek script kalmadi -- content/scripts'e ekle."

      # retention-days: ucretsiz hesapta artifact kotasi 500 MB. Video ~39 MB,
      # gunde 2 tane. 2 gun tutmak ~160 MB demek, rahat.
      - name: artifact
        if: steps.pick.outputs.path != ''
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          path: |
            out/**/*.mp4
            out/**/manifest.json
          retention-days: 2
          if-no-files-found: error

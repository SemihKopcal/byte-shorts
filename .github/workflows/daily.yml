name: daily

# Gunde 2 video, 12 saatte bir (UTC 04:15 16:15; Turkiye 07:15 19:15). Ilk 30 gun
# 2/gun + A/B testi (kullanici karari, 8 Kasim); veri gelince 4/gune cikilabilir:
# cron satirlarini 01:15 07:15 13:15 19:15 yap, tests/test_daily.py'deki sayiyi guncelle.
# Panelde yayin saatleri (Ayarlar > Yayin saatleri) uretimden SONRAya denk gelmeli:
# "07:15,19:15" (onay 04:15 uretimini 07:15'te, 16:15 uretimini 19:15'te yayinlar).
# TAM OTOMATIK, Gemini YOK:
#
#   senaryo  content/scripts'teki siradaki islenmemis senaryo (plan: content/plan.md).
#            Kuyruk bossa kosu ~15 saniyede KIRMIZI durur ("kuyruk bos"): hicbir
#            sey kurulmaz, render edilmez, dakika yanmaz. Kuyrukta 12 ya da daha az
#            senaryo kalinca (gunde 2 videoda 6 gun) uyari yazar.
#   render   kodla cizilir, QC'den gecer
#   YouTube  AUTO_PRIVACY neyse o gizlilikle yuklenir
#   defter   uretildi/yayinlandi kaydi repoya geri yazilir
#   release  video + Instagram/TikTok metinleri kalici bir adrese konur
#
# YAYIN MODU: depo degiskeni AUTO_PRIVACY
#   Settings > Secrets and variables > Actions > Variables
#   public | unlisted | private | off      (yoksa: public)
# Bir sey ters giderse tek yapacagin: AUTO_PRIVACY=off. Kod degismiyor.
# AUTO_INSTAGRAM / AUTO_TIKTOK: `off` yaparsan o platforma gonderilmez
# (secret'lar da yoksa zaten gonderilmez). Yalnizca mod `public` iken calisirlar.
# PANEL MODU: depo degiskeni PANEL_MODE=on ise video YouTube/Instagram/TikTok'a burada
# GITMEZ. R2'ye konur, panelde (byte.semihkopcal.com) onay bekler; onaylaninca ve saati
# gelince panel-publish workflow'u yayinlar. Bu modda AUTO_PRIVACY yok sayilir.
# Bu modda video GitHub Release'e ve Actions artifact'ine de KONMAZ: depo public, onay
# bekleyen video onaydan once herkese acik indirilebilir olurdu. Video yalniz R2'de (ozel).
# Kapatmak icin PANEL_MODE degiskenini sil (ya da off yap): eski dogrudan yayin geri gelir.
on:
  schedule:
    - cron: "15 4 * * *"
    - cron: "15 16 * * *"
  workflow_dispatch:
    inputs:
      script:
        description: "content/scripts altindaki dosya adi (bos = siradaki)"
        required: false
        default: ""
      mode:
        description: "yayin modu (auto = AUTO_PRIVACY degiskeni, yoksa public)"
        type: choice
        options: [auto, public, unlisted, private, "off"]
        default: auto

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write          # senaryo/defter commit'i + release icin
    env:
      SCRIPT_INPUT: ${{ inputs.script }}
      # secret'lar if: icinde okunamiyor; var mi yok mu diye burada bakiyoruz
      HAS_IG: ${{ secrets.INSTAGRAM_TOKEN != '' && secrets.INSTAGRAM_USER_ID != '' }}
      HAS_TT: ${{ secrets.TIKTOK_REFRESH_TOKEN != '' && secrets.TIKTOK_CLIENT_KEY != '' && secrets.TIKTOK_CLIENT_SECRET != '' }}
    steps:
      - uses: actions/checkout@v7

      # ── senaryo: HER SEYDEN ONCE ──────────────────────────────────────
      # pick_script yalniz standart kutuphane kullaniyor, kurulum beklemez.
      # Sira bossa ffmpeg/font/pip/ses modeli kurulumuna hic girmiyoruz.
      - name: sirada senaryo var mi
        id: pick
        run: python3 tools/pick_script.py "$SCRIPT_INPUT" >> "$GITHUB_OUTPUT"

      - name: kuyruk bos
        if: steps.pick.outputs.path == ''
        run: |
          echo "::error title=Kuyruk bos::content/scripts icinde islenmemis senaryo yok. Yeni parti yazilmali (content/plan.md). Gemini yolu daily'ye bagli degil."
          exit 1

      - name: kuyruk az kaldi mi
        if: steps.pick.outputs.left != ''
        env:
          LEFT: ${{ steps.pick.outputs.left }}
        run: |
          if [ "$LEFT" -le 12 ]; then
            echo "::warning title=Kuyruk azaliyor::bu video dahil $LEFT senaryo kaldi; yeni parti yazilmali (content/plan.md)"
          fi

      # apt DEGIL: runner'in Ubuntu aynasi 50 KB/s'ye dusup kosuyu zaman
      # asimina sokmustu. Ayni ikililer GitHub release'inden 15 saniyede
      # geliyor, cache'lenince hic inmiyor.
      - name: arac cache
        id: tools
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/bin
            ~/.local/share/fonts/inter
            ~/.local/share/fonts/cjk
          key: runner-tools-ffmpeg-inter4-notojp-v2

      - name: ffmpeg + fontlar
        run: bash tools/setup_runner.sh

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # 120 MB model her kosuda indirilmesin
      - name: ses modeli cache
        id: voice
        uses: actions/cache@v6
        with:
          path: voices
          key: piper-en-us-ryan-high-v1

      - name: ses modeli indir
        if: steps.voice.outputs.cache-hit != 'true'
        run: bash tools/fetch_voice.sh en-us-ryan-high

      # ── yayin modu ────────────────────────────────────────────────────
      - name: yayin modu
        id: mode
        env:
          INPUT_MODE: ${{ inputs.mode }}
          AUTO_PRIVACY: ${{ vars.AUTO_PRIVACY }}
        run: |
          v="${INPUT_MODE:-auto}"
          if [ "$v" = "auto" ]; then v="${AUTO_PRIVACY:-public}"; fi
          case "$v" in
            public|unlisted|private|off) ;;
            *) echo "::warning::bilinmeyen yayin modu '$v', private kullaniliyor"; v=private ;;
          esac
          echo "yayin modu: $v"
          echo "value=$v" >> "$GITHUB_OUTPUT"

      # Render'dan ONCE: secrets bozuksa 3 dakikalik render'in sonunda
      # ogrenmek yerine simdi biliyoruz. Basarisiz olsa da video uretilir
      # (continue-on-error); sadece yukleme atlanir ve kosu sonda kirmizi yanar.
      - name: youtube secrets kontrol
        id: ytcheck
        if: steps.mode.outputs.value != 'off' && vars.PANEL_MODE != 'on'
        continue-on-error: true
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python publish/youtube.py --check

      # ── uretim ────────────────────────────────────────────────────────
      - name: uret
        id: render
        continue-on-error: true
        env:
          SCRIPT: ${{ steps.pick.outputs.path }}
        run: python -m worker.build "$SCRIPT"

      # ── yayin ─────────────────────────────────────────────────────────
      - name: youtube'a yukle
        id: upload
        if: >-
          steps.render.outcome == 'success' &&
          steps.mode.outputs.value != 'off' &&
          steps.ytcheck.outcome == 'success' &&
          vars.PANEL_MODE != 'on'
        continue-on-error: true
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          SCRIPT: ${{ steps.pick.outputs.path }}
          MODE: ${{ steps.mode.outputs.value }}
        run: |
          dir="$(python tools/pick_script.py --dir "$(basename "$SCRIPT")" | sed -n 's/^dir=//p')"
          python publish/youtube.py "$dir/manifest.json" --privacy "$MODE"

      # ── panel ─────────────────────────────────────────────────────────
      # PANEL_MODE=on iken: video R2'ye konur, panel onayini bekler. Basarisiz olursa
      # senaryo defterde ISARETLENMEZ (sonraki kosu yeniden dener: video kaybolmaz).
      - name: panele gonder
        id: panel
        if: steps.render.outcome == 'success' && vars.PANEL_MODE == 'on'
        continue-on-error: true
        timeout-minutes: 15
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          SCRIPT: ${{ steps.pick.outputs.path }}
        run: |
          dir="$(python tools/pick_script.py --dir "$(basename "$SCRIPT")" | sed -n 's/^dir=//p')"
          python tools/r2_push.py "$dir"

      # ── Instagram / TikTok ────────────────────────────────────────────
      # Sadece mod PUBLIC iken (private/unlisted test kosusu Instagram'a gitmez).
      # Her biri depo degiskeniyle kapatilir: AUTO_INSTAGRAM=off, AUTO_TIKTOK=off.
      # Secret'lar yoksa adim hic calismaz (hata degil). Basarisizlik kosuyu
      # kirmizi yapmaz, uyari yazar: asil is YouTube.
      - name: instagram'a yukle
        id: instagram
        if: >-
          steps.render.outcome == 'success' &&
          steps.mode.outputs.value == 'public' &&
          vars.AUTO_INSTAGRAM != 'off' && env.HAS_IG == 'true' &&
          vars.PANEL_MODE != 'on'
        continue-on-error: true
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          SCRIPT: ${{ steps.pick.outputs.path }}
        run: |
          dir="$(python tools/pick_script.py --dir "$(basename "$SCRIPT")" | sed -n 's/^dir=//p')"
          url="$(bash tools/host_video.sh "$dir")"
          python publish/instagram.py "$dir/manifest.json" --video-url "$url"

      - name: tiktok taslagi
        id: tiktok
        if: >-
          steps.render.outcome == 'success' &&
          steps.mode.outputs.value == 'public' &&
          vars.AUTO_TIKTOK != 'off' && env.HAS_TT == 'true' &&
          vars.PANEL_MODE != 'on'
        continue-on-error: true
        timeout-minutes: 15
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_NEW_REFRESH_FILE: ${{ runner.temp }}/tiktok-new-refresh
          GH_PAT: ${{ secrets.GH_PAT }}
          SCRIPT: ${{ steps.pick.outputs.path }}
        run: |
          dir="$(python tools/pick_script.py --dir "$(basename "$SCRIPT")" | sed -n 's/^dir=//p')"
          rc=0
          python publish/tiktok.py "$dir/manifest.json" || rc=$?
          # TikTok yeni refresh token dondurduysa secret'i guncelle (GH_PAT gerekir)
          if [ -s "$TIKTOK_NEW_REFRESH_FILE" ]; then
            if [ -n "$GH_PAT" ]; then
              GH_TOKEN="$GH_PAT" gh secret set TIKTOK_REFRESH_TOKEN \
                --repo "$GITHUB_REPOSITORY" < "$TIKTOK_NEW_REFRESH_FILE"
              echo "TIKTOK_REFRESH_TOKEN guncellendi"
            else
              echo "::warning::TikTok yeni refresh token verdi ama GH_PAT yok, kaydedilemedi; yarin yukleme calismayabilir (rehbere bak: GH_PAT)"
            fi
          fi
          exit $rc

      # Instagram/TikTok'u elle yuklemek icin: video + metinler kalici bir adreste. Basarisiz
      # olursa kosuyu kirmizi yapmiyor; asil is YouTube.
      # PANEL MODUNDA ACIK DEGIL: depo public, release herkese acik indirilebilir.
      - name: release
        id: release
        if: steps.render.outcome == 'success' && vars.PANEL_MODE != 'on'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SCRIPT: ${{ steps.pick.outputs.path }}
        run: |
          dir="$(python tools/pick_script.py --dir "$(basename "$SCRIPT")" | sed -n 's/^dir=//p')"
          bash tools/release.sh "$dir"

      # ── defter ────────────────────────────────────────────────────────
      # Basarisiz kosuda da isler (always): yoksa ayni bozuk senaryo her
      # kosuda yeniden secilir ve kuyruk sonsuza kadar tikanir.
      - name: defteri isle
        if: always() && steps.pick.outputs.path != ''
        env:
          SCRIPT: ${{ steps.pick.outputs.path }}
          PANEL_MODE: ${{ vars.PANEL_MODE }}
          RENDER: ${{ steps.render.outcome }}
          PANEL: ${{ steps.panel.outcome }}
        run: |
          if [ -n "$SCRIPT" ]; then
            if [ "$PANEL_MODE" = "on" ] && [ "$RENDER" = "success" ] && [ "$PANEL" != "success" ]; then
              echo "::warning title=Panele gonderilemedi::senaryo defterde isaretlenmedi; sonraki kosu yeniden dener"
            else
              python tools/pick_script.py --mark "$(basename "$SCRIPT")"
            fi
          fi
          git config user.name  "byte-bot"
          git config user.email "byte-bot@users.noreply.github.com"
          git add -A content
          git diff --cached --quiet || git commit -m "daily: $(basename "${SCRIPT:-rejected}")"
          git pull --rebase --autostash
          git push

      # retention-days: ucretsiz hesapta artifact kotasi 500 MB. Video ~39 MB,
      # gunde 2 tane, 2 gun saklaniyor (~156 MB). Kalici kopya zaten release'te.
      # Panel modunda yuklenmez: public depoda artifact'i de herhangi bir GitHub hesabi indirebilir.
      - name: artifact
        if: steps.render.outcome == 'success' && vars.PANEL_MODE != 'on'
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          path: |
            out/**/*.mp4
            out/**/manifest.json
            out/**/captions.md
          retention-days: 2
          if-no-files-found: error

      # Kosunun rengi gercegi soylesin: video uretilmediyse ya da yukleme
      # basarisizsa kirmizi. (continue-on-error adimlari tek basina kirmizi
      # yakmaz; burada hepsini toplayip karar veriyoruz.)
      - name: sonuc
        if: always() && steps.pick.outputs.path != ''
        env:
          RENDER: ${{ steps.render.outcome }}
          UPLOAD: ${{ steps.upload.outcome }}
          YTCHECK: ${{ steps.ytcheck.outcome }}
          RELEASE: ${{ steps.release.outcome }}
          INSTAGRAM: ${{ steps.instagram.outcome }}
          TIKTOK: ${{ steps.tiktok.outcome }}
          PANEL: ${{ steps.panel.outcome }}
          PANEL_MODE: ${{ vars.PANEL_MODE }}
        run: |
          fail=0
          if [ "$PANEL_MODE" = "on" ] && [ "$RENDER" = "success" ] && [ "$PANEL" = "failure" ]; then
            echo "::error::panele gonderilemedi (panele gonder adimina bak); senaryo defterde isaretlenmedi, sonraki kosu yeniden dener"; fail=1
          fi
          if [ "$RENDER" != "success" ]; then
            echo "::error::video uretilemedi"; fail=1
          fi
          if [ "$YTCHECK" = "failure" ]; then
            echo "::error::YouTube secrets gecersiz (check adimina bak); video yuklenmedi"; fail=1
          fi
          if [ "$UPLOAD" = "failure" ]; then
            echo "::error::YouTube yuklemesi basarisiz"; fail=1
          fi
          if [ "$INSTAGRAM" = "failure" ]; then
            echo "::warning::Instagram'a yuklenemedi (instagram adimina bak); video Release'te, elle yukleyebilirsin"
          fi
          if [ "$TIKTOK" = "failure" ]; then
            echo "::warning::TikTok taslagi olusturulamadi (tiktok adimina bak); video Release'te"
          fi
          if [ "$RELEASE" = "failure" ]; then
            echo "::warning::release olusturulamadi (Instagram/TikTok icin kalici adres yok)"
          fi
          exit $fail

name: daily

# Gunde 2 video. Saatler UTC.
# Yukleme ADIMI YOK: hat sadece uretiyor, sen artifact'i indirip izliyorsun.
# Onayladiktan sonra publish.yml'i elle tetikleyerek YouTube'a basiyoruz.
on:
  schedule:
    - cron: "15 4 * * *"
    - cron: "15 13 * * *"
  workflow_dispatch:
    inputs:
      script:
        description: "content/scripts altindaki dosya adi (bos = siradaki)"
        required: false
        default: ""

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write          # uretilen senaryoyu repoya geri yazmak icin
    steps:
      - uses: actions/checkout@v4
      # apt DEGIL: runner'in Ubuntu aynasi 50 KB/s'ye dusup kosuyu 40 dakikalik
      # zaman asimina soktu. Ayni ikililer GitHub release'inden 15 saniyede
      # geliyor, ustelik cache'lenince hic inmiyor.
      - name: arac cache
        id: tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/bin
            ~/.local/share/fonts/inter
            ~/.local/share/fonts/cjk
          key: runner-tools-ffmpeg-inter4-notojp-v2

      - name: ffmpeg + fontlar
        run: bash tools/setup_runner.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # 120 MB model her kosuda indirilmesin. Cache anahtari ses adiyla sabit.
      - name: ses modeli cache
        id: voice
        uses: actions/cache@v4
        with:
          path: voices
          key: piper-en-us-ryan-high-v1

      - name: ses modeli indir
        if: steps.voice.outputs.cache-hit != 'true'
        run: bash tools/fetch_voice.sh en-us-ryan-high

      - name: sirada senaryo var mi
        id: pick
        run: python tools/pick_script.py "${{ inputs.script }}" >> "$GITHUB_OUTPUT"

      # Sira bossa Gemini yeni bir senaryo yaziyor. Urettigi JSON once
      # dogrulamadan geciyor (sahne adlari, kaynak, sure, tekrar); gecemezse
      # dosya yazilmiyor ve kosu burada duruyor.
      - name: konu uret
        if: steps.pick.outputs.path == ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python tools/write_script.py

      - name: yeni senaryoyu sec
        id: pick2
        if: steps.pick.outputs.path == ''
        run: python tools/pick_script.py >> "$GITHUB_OUTPUT"
      - name: uret
        env:
          SCRIPT: ${{ steps.pick.outputs.path || steps.pick2.outputs.path }}
        run: python -m worker.build "$SCRIPT"

      # Uretileni defterе isle ve geri commit et. Bu olmadan kuyruk
      # ILERLEMIYOR: published.json sadece yayinlayinca doluyor, dolayisiyla
      # yayinlamadigin surece daily her gece AYNI videoyu uretiyordu.
      - name: defteri isle
        env:
          SCRIPT: ${{ steps.pick.outputs.path || steps.pick2.outputs.path }}
        run: |
          python tools/pick_script.py --mark "$(basename "$SCRIPT")"
          git config user.name  "byte-bot"
          git config user.email "byte-bot@users.noreply.github.com"
          git add content/built.json content/scripts
          git diff --cached --quiet || git commit -m "uretildi: $(basename "$SCRIPT")"
          git pull --rebase --autostash
          git push

      # retention-days: ucretsiz hesapta artifact kotasi 500 MB. Video ~39 MB,
      # gunde 2 tane. 2 gun tutmak ~160 MB demek, rahat.
      - name: artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          path: |
            out/**/*.mp4
            out/**/manifest.json
          retention-days: 2
          if-no-files-found: error

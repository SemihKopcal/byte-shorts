name: publish

# Onay kapisi. Sadece ELLE tetikleniyor -- hicbir video senin bakmadigin
# bir anda yayina cikmiyor. daily.yml videoyu uretir, sen izlersin, burayi
# calistirirsin.
on:
  workflow_dispatch:
    inputs:
      script:
        description: "content/scripts altindaki dosya adi"
        required: true
      public:
        description: "public olarak yukle (bos birakirsan private)"
        type: boolean
        default: false

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write          # published.json'u geri yazmak icin
    steps:
      - uses: actions/checkout@v7
      # apt DEGIL: runner'in Ubuntu aynasi 50 KB/s'ye dusup kosuyu 40 dakikalik
      # zaman asimina soktu. Ayni ikililer GitHub release'inden 15 saniyede
      # geliyor, ustelik cache'lenince hic inmiyor.
      - name: arac cache
        id: tools
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/bin
            ~/.local/share/fonts/inter
            ~/.local/share/fonts/cjk
          key: runner-tools-ffmpeg-inter4-notojp-v2

      - name: ffmpeg + fontlar
        run: bash tools/setup_runner.sh

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # Render'dan ONCE: secrets yanlissa 3 dakikalik render'i bosa
      # harcamadan 5 saniyede duruyoruz ve hangi degerin yanlis oldugunu
      # soyluyoruz.
      - name: secrets kontrol
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python publish/youtube.py --check

      - name: ses modeli cache
        id: voice
        uses: actions/cache@v6
        with:
          path: voices
          key: piper-en-us-ryan-high-v1

      - name: ses modeli indir
        if: steps.voice.outputs.cache-hit != 'true'
        run: bash tools/fetch_voice.sh en-us-ryan-high
      # ── klon ses ──────────────────────────────────────────────────────
      # Kendi sesinin klonu: Colab'da onceden uretilip PRIVATE R2'ye konur (tools/r2_voice.py push).
      # Bu senaryo icin varsa indirilir ve render Piper yerine onu kullanir; yoksa uyari yazilir ve
      # Piper sesiyle devam edilir. brand.json > voice_clone > require=true ise render durur
      # (kanalin sesi sessizce degismesin). R2 secret'lari hic yoksa adim sessizce atlanir.
      # Dizin out/ altinda: ses dosyalari ne cache'e ne commit'e ne artifact'e girer.
      - name: klon ses indir
        id: clonevoice
        continue-on-error: true
        timeout-minutes: 5
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          BYTE_CLONE_DIR: out/_clone
          SCRIPT_INPUT: ${{ inputs.script }}
        run: |
          dir="$(python tools/pick_script.py --dir "$SCRIPT_INPUT" | sed -n 's/^dir=//p')"
          id="${dir##*/}"
          python tools/r2_voice.py pull "$id" "$BYTE_CLONE_DIR/$id" || echo "::warning title=Klon ses indirilemedi::R2'ye ulasilamadi; Piper sesiyle devam"

      - name: yeniden uret + QC
        env:
          SCRIPT_INPUT: ${{ inputs.script }}
          BYTE_CLONE_DIR: out/_clone
        run: python -m worker.build "content/scripts/$SCRIPT_INPUT"

      - name: cikti dizini
        id: m
        env:
          SCRIPT_INPUT: ${{ inputs.script }}
        run: python tools/pick_script.py --dir "$SCRIPT_INPUT" >> "$GITHUB_OUTPUT"

      - name: YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          PUBLIC: ${{ inputs.public }}
          MAN_DIR: ${{ steps.m.outputs.dir }}
        run: |
          if [ "$PUBLIC" = "true" ]; then
            python publish/youtube.py "$MAN_DIR/manifest.json" --publish
          else
            python publish/youtube.py "$MAN_DIR/manifest.json"
          fi

      - name: kaydi isle
        env:
          SCRIPT_INPUT: ${{ inputs.script }}
        run: |
          git config user.name  "byte-bot"
          git config user.email "byte-bot@users.noreply.github.com"
          git add content/published.json
          git diff --cached --quiet || git commit -m "publish: $SCRIPT_INPUT"
          # Kosu surerken baska bir push olmus olabilir; rebase etmeden
          # push reddediliyor ve video yuklendigi halde adim kirmizi yaniyor.
          git pull --rebase --autostash
          git push
